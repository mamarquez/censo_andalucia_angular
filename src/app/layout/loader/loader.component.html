@if (cargando) {
  <div id="loadingOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; text-align:center;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
      <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i>
      <p>{{ 'loader.cargando' | translate }}</p>
    </div>
  </div>
}
