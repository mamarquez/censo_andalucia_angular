@if (etiqueta) {
  <label [for]="idControl">{{ etiqueta }}</label>
}
<select
  [id]="idControl"
  class="form-control"
  [disabled]="bloqueado()"
  [title]="titulo"
  [value]="valor()"
  (change)="onSelect($event)"
  (blur)="onBlur()">
  @if (placeholderKey) {
    <option value="">{{ placeholderKey | translate }}</option>
  }
  @for (opcion of opciones; track opcion.valor) {
    <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
  }
</select>
