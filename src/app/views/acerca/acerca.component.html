<!-- Site Showcase -->
<div class="site-showcase">
  <!-- Start Page Header -->
  <div class="parallax page-header" style="background-image:url('/images/bg.jpg');">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h1>{{ 'acerca.titulo_pagina' | translate }}</h1>
        </div>
      </div>
    </div>
  </div>
  <!-- End Page Header -->
</div>
<!-- Start Content -->
<div class="main" role="main">
  <div id="content" class="content full">
    <div class="container">
      <div class="page">
        <div class="row">
          <div class="col-md-12">
            <div [innerHTML]="acerca"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
