<!-- Site Showcase -->
<div class="site-showcase">
  <!-- Start Page Header -->
  <div class="parallax page-header" style="background-image:url('/images/bg.jpg');">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h1>{{ 'widget.titulo_pagina' | translate }}</h1>
        </div>
      </div>
    </div>
  </div>
  <!-- End Page Header -->
</div>
<!-- Start Content -->
<main class="main" [attr.aria-label]="'widget.titulo_pagina' | translate">
  <div id="content" class="content full">
    <div class="container">
      <div class="page">
        <div class="alert alert-danger alert-dismissible fade show" id="error_busqueda" style="display:none;">
          {{ 'widget.alerta_busqueda' | translate }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h2>{{ 'widget.titulo' | translate }}</h2>
        <p>{{ 'widget.descripcion' | translate }}</p>

        <div class="row">
          <div class="col-md-12">
            <div class="padding-as25 margin-30 lgray-bg">
              <div class="row">
                <div class="col-md-4 col-sm-4">
                  <label for="provincia">{{ 'widget.provincia' | translate }}</label>
                  <p-select
                    id="provincia"
                    fluid
                    [loading]="cargandoProvincias"
                    [options]="provincias"
                    [(ngModel)]="provinciaSeleccionada"
                    optionLabel="nombre"
                    optionValue="id"
                    [placeholder]="'widget.provincia_placeholder' | translate"
                    (ngModelChange)="onProvinciaChange()"
                  >
                  </p-select>
                </div>
                <div class="col-md-4 col-sm-4">
                  <label for="municipio">{{ 'widget.municipio' | translate }}</label>
                  <p-select
                    id="municipio"
                    fluid
                    [loading]="cargandoMunicipios"
                    [options]="municipios"
                    [(ngModel)]="municipioSeleccionada"
                    optionLabel="nombre"
                    optionValue="id"
                    [placeholder]="'widget.municipio_placeholder' | translate"
                    (ngModelChange)="generarEnlace()"
                  >
                  </p-select>
                </div>
                <div class="col-md-3 col-sm-3">
                  <label for="deporte">{{ 'widget.deporte' | translate }}</label>
                  <p-select
                    id="deporte"
                    fluid
                    [loading]="cargandoDeportes"
                    [options]="deportes"
                    [(ngModel)]="deporteSeleccionada"
                    optionLabel="nombre"
                    optionValue="id"
                    [placeholder]="'widget.deporte_placeholder' | translate"
                    (ngModelChange)="generarEnlace()"
                  >
                  </p-select>
                </div>
              </div>
              <div class="row">
                <div class="col-md-3 col-sm-3">
                  <label for="anchura">{{ 'widget.anchura' | translate }}</label>
                  <p-inputnumber
                    inputId="anchura"
                    name="anchura"
                    [(ngModel)]="anchura"
                    [min]="0"
                    [step]="1"
                    [useGrouping]="false"
                    placeholder="Anchura"
                    fluid
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    (ngModelChange)="generarEnlace()"
                  >
                  </p-inputnumber>
                </div>
                <div class="col-md-3 col-sm-3">
                  <label for="altura">{{ 'widget.altura' | translate }}</label>
                  <p-inputnumber
                    inputId="altura"
                    name="altura"
                    [(ngModel)]="altura"
                    [min]="0"
                    [step]="1"
                    [useGrouping]="false"
                    placeholder="Altura"
                    fluid
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    (ngModelChange)="generarEnlace()">
                  </p-inputnumber>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="row" id="code_row"> <!-- style="display:none;"> -->
          <div class="col-md-12">
            <div class="padding-as25 margin-30 lgray-bg">
              <div class="row">
                <div class="col-md-12">
                  <label for="codigoWidget">{{ 'widget.codigo_label' | translate }}</label>
                  <textarea
                    [ngModel]="mapa"
                    name="codigoWidget"
                    id="codigoWidget"
                    cols="50"
                    rows="5"
                    disabled
                    class="form-control">
                  </textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
