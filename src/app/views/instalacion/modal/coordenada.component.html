<div class="modal fade" id="loc" tabindex="-1" aria-labelledby="modalCoordenadasLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCoordenadasLabel">{{ 'instalacion.localizacion' | translate }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div class="alert alert-info mb-0" role="alert">
          <div class="d-flex align-items-center mb-2">
            <label for="coordX" class="fw-bold me-2 mb-0" style="min-width: 25px;">X:</label>
            <input type="text" id="coordX" class="form-control form-control-lg" readonly [value]="x()" style="text-align: right;" />
          </div>
          <div class="d-flex align-items-center">
            <label for="coordY" class="fw-bold me-2 mb-0" style="min-width: 25px;">Y:</label>
            <input type="text" id="coordY" class="form-control form-control-lg" readonly [value]="y()" style="text-align: right;" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          {{ 'widget.cerrar' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
