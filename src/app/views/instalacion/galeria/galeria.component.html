<div>
  <h4>
    <i class="fa fa-camera"></i> {{ 'instalacion.galeria' | translate }}
  </h4>

  @if (cargando()) {
    <p>{{ 'instalacion.galeria_cargando' | translate }}</p>
  } @else if (imagenes().length) {
    <div
      class="galeria-swiper"
      navigation="true"
      pagination="true"
      loop="true">
      @for (item of imagenes(); track item.id) {
        <swiper-slide>
          <a [href]="item.url" [attr.data-title]="item.descripcion || item.nombre">
            <img [src]="item.url" [alt]="item.descripcion || item.nombre" class="img-responsive">
          </a>
        </swiper-slide>
      }
    </div>
  } @else {
    <p>{{ 'instalacion.galeria_vacia' | translate }}</p>
  }
</div>
